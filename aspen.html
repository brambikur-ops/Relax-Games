    ptr.x = x; ptr.y = y; ptr.in = true; ptr.last = now; lastInteract = now;
    if (!hintGone) { hintGone = true; setTimeout(function () { hint.classList.add('gone'); }, 2500); }
  }
  var countEl = document.getElementById('count'), hint = document.getElementById('hint'), hintGone = false;
  cv.addEventListener('pointerdown', function (e) {
    ptr.down = true; try { cv.setPointerCapture(e.pointerId); } catch (x) {}
    setPos(e, false); pv.x = 0; pv.y = 0; initAudio(); closeMenu();
  });
  cv.addEventListener('pointermove', function (e) { if (e.pointerType === 'mouse' || ptr.down) setPos(e, true); });
  function up() { ptr.down = false; }
  cv.addEventListener('pointerup', function (e) { up(); if (e.pointerType !== 'mouse') ptr.in = false; });
  cv.addEventListener('pointercancel', function () { up(); ptr.in = false; });
  cv.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse') ptr.in = false; });

  /* ---------- controls ---------- */
  var menu = document.getElementById('menu'), ctl = document.getElementById('ctl');
  function closeMenu() { ctl.hidden = true; menu.setAttribute('aria-expanded', 'false'); }
  menu.addEventListener('click', function () { var open = ctl.hidden; ctl.hidden = !open; menu.setAttribute('aria-expanded', open ? 'true' : 'false'); });
  var sky = document.getElementById('sky'), when = document.getElementById('when'), lastName = '';
  sky.value = Math.round(T * 1000);
  sky.addEventListener('input', function () { T = sky.value / 1000; lastInteract = performance.now() / 1000; });
  document.getElementById('vol').addEventListener('input', function (e) { vol = e.target.value / 100; applyVol(); });
  document.getElementById('wind').addEventListener('input', function (e) { windK = e.target.value / 100; });
  function toggle(btn, on) { btn.setAttribute('aria-pressed', on ? 'true' : 'false'); }
  var driftBtn = document.getElementById('drift'), sndBtn = document.getElementById('snd');
  toggle(driftBtn, autoDrift);
  driftBtn.addEventListener('click', function () { autoDrift = !autoDrift; toggle(driftBtn, autoDrift); });
  sndBtn.addEventListener('click', function () { muted = !muted; toggle(sndBtn, !muted); initAudio(); applyVol(); });
  var chmBtn = document.getElementById('chm');
  chmBtn.addEventListener('click', function () { chimesOn = !chimesOn; toggle(chmBtn, chimesOn); initAudio(); });
  var motBtn = document.getElementById('mot'); toggle(motBtn, motion);
  motBtn.addEventListener('click', function () { motion = !motion; toggle(motBtn, motion); bake(); builtT = -1; });
  var nsdBtn = document.getElementById('nsd');
  nsdBtn.addEventListener('click', function () { nightSnd = !nightSnd; toggle(nsdBtn, nightSnd); initAudio(); });
  function startGust(amp, clear) { gust = { dir: Math.random() < 0.5 ? 1 : -1, x: 0, amp: amp, age: 0, clear: !!clear }; gust.x = gust.dir > 0 ? -W * 0.2 : W * 1.2; }
  document.getElementById('gust').addEventListener('click', function () { initAudio(); startGust(1.2, true); chime(0.9, 0); chime(0.8, 0.3); chime(0.7, 0.65); lastInteract = performance.now() / 1000; });

  /* ---------- loop ---------- */
  var lastT = 0, frame = 0;
  function loop(ms) {
    var time = ms / 1000, dt = Math.min(0.05, lastT ? time - lastT : 0.016); lastT = time; frame++;
    if (autoDrift) { T += dt / 240; if (T >= 1) T -= 1; if (frame % 10 === 0) sky.value = Math.round(T * 999); }
    if (builtT < 0 || (frame % 8 === 0 && Math.abs(T - builtT) > 0.0015)) rebuild();
    var nm = (T >= 0.9 || T < 0.12) ? 'Dawn' : T < 0.4 ? 'Day' : T < 0.62 ? 'Sunset' : 'Night'; if (nm !== lastName) { lastName = nm; when.textContent = nm; }
    var pnow = performance.now() / 1000;
    var lifts = step(dt, time);
    var wi = clamp(wamp * Math.min(1, Math.hypot(pv.x, pv.y) / 600) * windK + (gust ? 0.8 * gust.amp : 0), 0, 1.2);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    drawSky(time);
    ctx.drawImage(tinted, 0, 0, W, H);
    drawGrass(time, dt, wi); if (motion && MOUNDS.length) ctx.drawImage(moundT, 0, groundTop * DPR, moundT.width, moundT.height - groundTop * DPR, 0, groundTop, W, H - groundTop); drawShimmer(time, wi);
    drawRays(time);
    drawLeaves();
    drawHalo();
    drawEffects(time);
    drawTrail(pnow);
    ctx.fillStyle = vignette; ctx.fillRect(0, 0, W, H);
    windSound(wi, time); chimes(wi); nightSounds(time);
    var spd2 = Math.hypot(pv.x, pv.y);
    stir = Math.min(2, stir + lifts * 0.5 + (nearCount > 0 ? Math.min(1, nearCount / 12) * Math.min(1, spd2 / 500) * wamp * dt * 1.6 : 0));
    if (stir >= 1 && pnow - lastMotion > 0.7 + Math.random() * 0.4) {
      var ix = clamp(Math.floor(ptr.x / W * CH.length) + Math.floor(Math.random() * 3) - 1, 0, CH.length - 1);
      chime(0.5 + 0.4 * Math.min(1, spd2 / 800), 0, ix); stir = 0; lastMotion = pnow;
    }
    requestAnimationFrame(loop);
  }
  resize();
  requestAnimationFrame(loop);
})();
</script>
