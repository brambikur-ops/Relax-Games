<style>

:root {

html, body { height: 100%; }

#stage { position: relative; width: 100%; height: 100%; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; background: var(--night); }

.meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); font-variant-numeric: tabular-nums; }
#tod { color: var(--paper); font-size: 15px; }
.hud.bot { flex-wrap: nowrap; }
.dock { position: relative; flex: none; pointer-events: auto; }
.ctl { position: absolute; right: 0; bottom: calc(100% + 8px); width: min(calc(100vw - 32px), 440px); display: flex; flex-direction: column; gap: 10px; padding: 12px; background: var(--glass); border: 1px solid var(--edge); border-radius: 10px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); text-shadow: none; box-sizing: border-box; }
.row { display: flex; align-items: center; gap: 12px; }
.btns { display: flex; gap: 8px; }
.btns button { flex: 1 1 0; }

#chev { display: inline-block; font-size: 11px; transition: transform .2s ease; }
#menu[aria-expanded="true"] #chev { transform: rotate(180deg); }
.ctl label { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
input[type=range] { -webkit-appearance: none; appearance: none; flex: 1 1 140px; width: auto; min-width: 0; height: 28px; background: transparent; cursor: pointer; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 3px; background: linear-gradient(90deg, #1b2450, #ff9a62 25%, #6fb6f0 50%, #ff7a4d 75%, #1b2450); border-radius: 2px; }
input[type=range]::-moz-range-track { height: 3px; background: linear-gradient(90deg, #1b2450, #ff9a62 25%, #6fb6f0 50%, #ff7a4d 75%, #1b2450); border-radius: 2px; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--paper); border: 0; margin-top: -6.5px; box-shadow: 0 0 0 4px rgba(244,241,230,.2); }
input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--paper); border: 0; box-shadow: 0 0 0 4px rgba(244,241,230,.2); }
button { font: inherit; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--paper); background: transparent; border: 1px solid var(--edge); border-radius: 6px; padding: 10px 11px; min-height: 40px; cursor: pointer; }
button:hover { border-color: var(--paper); }

[hidden] { display: none !important; }
@media (max-width: 600px) {

      for (var k = 0; k < 8; k++) { var an = k * 0.785 + t * 1.5; ctx.beginPath(); ctx.arc(p.x + Math.cos(an) * r * 1.35, p.y + Math.sin(an) * r * 1.35, 2.2, 0, 6.2832); ctx.fill(); }
    }
  }

  function render() {
    setM(1, 0, 0, 1, 0, 0);
    buildPalette();
    shadowA = 0.24 * (0.35 + 0.65 * (1 - env.star));
    drawSky();
    drawGround();
    drawBlades();
    for (var i = 0; i < clovers.length; i++) drawClover(clovers[i]);
    drawHalos();
    drawFlies();
    drawSparkles();
    var vg = ctx.createRadialGradient(W / 2, H * 0.55, Math.min(W, H) * 0.4, W / 2, H * 0.55, Math.max(W, H) * 0.8);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.28)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }

  var last = 0;
  function frame(ts) {
    var dt = Math.min(0.05, (ts - last) / 1000 || 0.016); last = ts;
    update(dt); render();
    requestAnimationFrame(frame);
  }

  /* ---------- input and controls ---------- */
  function resize() {
    W = cv.clientWidth; H = cv.clientHeight; dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    if (!clovers.length) buildWorld(); else layout();
  }
  function point(ev) {
    var r = cv.getBoundingClientRect();
    px = ev.clientX - r.left; py = ev.clientY - r.top; lastMove = now;
    touching = ev.pointerType === 'touch';
  }
  cv.addEventListener('pointermove', point);
  cv.addEventListener('pointerdown', function (ev) { point(ev); if (!muted) startAudio(); $('hint').classList.add('gone'); });
  function release(ev) { if (ev.pointerType === 'touch') { px = -9999; py = -9999; touching = false; lastMove = now; } }
  cv.addEventListener('pointerup', release);
  cv.addEventListener('pointercancel', release);
  cv.addEventListener('pointerleave', function (ev) { if (ev.pointerType !== 'touch') { px = -9999; py = -9999; } });

  var slider = $('time');
  slider.addEventListener('input', function () { u = slider.value / 1000; });
  slider.addEventListener('pointerdown', function () { dragging = true; });
  window.addEventListener('pointerup', function () { dragging = false; });
  slider.addEventListener('keydown', function () { dragging = true; });
  slider.addEventListener('keyup', function () { dragging = false; });
  $('auto').addEventListener('click', function () {
    auto = !auto; this.textContent = auto ? 'Drift on' : 'Drift off'; this.setAttribute('aria-pressed', auto);
  });
  $('glow').addEventListener('click', function () {
    glowOn = !glowOn; this.textContent = glowOn ? 'Glow on' : 'Glow off'; this.setAttribute('aria-pressed', glowOn);
  });
  $('snd').addEventListener('click', function () {
    muted = !muted; this.textContent = muted ? 'Sound off' : 'Sound on';
    if (!muted) startAudio();
    if (master) master.gain.value = muted ? 0 : 0.8;
  });
  var dock = $('ctl').parentNode, menuBtn = $('menu'), ctlBox = $('ctl'), menuTimer = 0;
  var small = function () { return window.innerWidth < 700 || (window.matchMedia && matchMedia('(pointer: coarse)').matches); };
  function setOpen(v) {
    ctlBox.hidden = !v; menuBtn.setAttribute('aria-expanded', v ? 'true' : 'false');
    $('hint').style.visibility = v && small() ? 'hidden' : '';
    clearTimeout(menuTimer);
    if (v && small()) menuTimer = setTimeout(function () { setOpen(false); }, 7000);
  }
  menuBtn.addEventListener('click', function () { setOpen(ctlBox.hidden); });
  dock.addEventListener('pointerdown', function () { if (!ctlBox.hidden && small()) setOpen(true); });
  dock.addEventListener('input', function () { if (!ctlBox.hidden && small()) setOpen(true); });
  cv.addEventListener('pointerdown', function () { if (small() && !ctlBox.hidden) setOpen(false); });
  window.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && !ctlBox.hidden) setOpen(false); });
  setOpen(!small());
  window.addEventListener('resize', resize);
  setTimeout(function () { $('hint').classList.add('gone'); }, 14000);

  buildMoon();
  resize();
  requestAnimationFrame(frame);
})();
</script>
