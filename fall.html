  /* ---------- sound: wind rustling in the trees ---------- */
  var chimesOn = true, stir = 0, lastMotion = 0, CH = [783.99, 880, 987.77, 1174.66, 1318.51, 1567.98], chimeBus, nextChime = 0, vol = 0.4, AC = null, master, windG, bp, rustG, rbp, nearCount = 0;

    var r = cv.getBoundingClientRect(), nw = Math.max(1, Math.round(r.width)), nh = Math.max(1, Math.round(r.height));
